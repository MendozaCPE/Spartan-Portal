<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Outer shield border (dark red) -->
  <path d="M512 20 L950 120 L950 520 Q950 720 512 1000 Q74 720 74 520 L74 120 Z" fill="#8B1014" />
  
  <!-- White border -->
  <path d="M512 60 L910 150 L910 520 Q910 700 512 960 Q114 700 114 520 L114 150 Z" fill="#FFFFFF" />
  
  <!-- Inner shield (bright red with gradient) -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E53935;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <path d="M512 90 L870 170 L870 520 Q870 680 512 920 Q154 680 154 520 L154 170 Z" fill="url(#shieldGrad)" />
  
  <!-- Central vertical line (subtle 3D effect) -->
  <line x1="512" y1="170" x2="512" y2="920" stroke="#B71C1C" stroke-width="2" opacity="0.3" />
  
  <!-- Crossed Sword (left side) - detailed with pommel and grip -->
  <!-- Sword blade -->
  <line x1="320" y1="320" x2="480" y2="680" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />
  <line x1="320" y1="320" x2="480" y2="680" stroke="#C62828" stroke-width="8" stroke-linecap="round" />
  
  <!-- Crossguard -->
  <line x1="420" y1="610" x2="540" y2="490" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round" />
  
  <!-- Grip -->
  <line x1="480" y1="680" x2="540" y2="740" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />
  <line x1="490" y1="690" x2="495" y2="695" stroke="#D32F2F" stroke-width="2" />
  <line x1="500" y1="700" x2="505" y2="705" stroke="#D32F2F" stroke-width="2" />
  <line x1="510" y1="710" x2="515" y2="715" stroke="#D32F2F" stroke-width="2" />
  <line x1="520" y1="720" x2="525" y2="725" stroke="#D32F2F" stroke-width="2" />
  
  <!-- Pommel -->
  <circle cx="560" cy="760" r="26" fill="#FFFFFF" />
  <circle cx="560" cy="760" r="18" fill="#E8E8E8" />
  
  <!-- Crossed Spear (right side) -->
  <!-- Spear shaft -->
  <line x1="544" y1="680" x2="704" y2="320" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" />
  
  <!-- Spear rings near head -->
  <circle cx="680" cy="350" r="16" fill="none" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="665" cy="375" r="16" fill="none" stroke="#FFFFFF" stroke-width="6" />
  
  <!-- Spearhead (detailed diamond shape) -->
  <path d="M704 320 L730 280 L704 200 L678 280 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
  <line x1="704" y1="250" x2="704" y2="320" stroke="#C62828" stroke-width="6" />
</svg>
